name: pages

# Builds the Docus documentation site (docs/) and publishes it to GitHub Pages.
# Setup and troubleshooting: docs/README.md.

on:
  push:
    branches: [main]
    # The docs build reads the CSS, engine, preset and example pages, so changes
    # to any of them change the published site (sizes, tables, live previews).
    paths:
      - "docs/**"
      - "packages/**"
      - "examples/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time: a running deployment always finishes, and a newer
# push replaces any run still waiting behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # Project site by default: https://<owner>.github.io/<repo>/.
      # For a custom domain set the repository variables DOCS_SITE_URL
      # (e.g. https://bluecss.dev) and DOCS_BASE_URL (/).
      NUXT_SITE_URL: ${{ vars.DOCS_SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
      NUXT_APP_BASE_URL: ${{ vars.DOCS_BASE_URL || format('/{0}/', github.event.repository.name) }}
      NUXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter blue-css-docs test
      # Static build under the base path, then the base-path fixes for the
      # URLs Docus writes without it. A failed build stops here: nothing is published.
      - run: pnpm docs:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.output/public
      - id: deployment
        uses: actions/deploy-pages@v4
